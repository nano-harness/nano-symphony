name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x
      - name: Install dependencies
        timeout-minutes: 5
        run: |
          bun install --frozen-lockfile
          cd frontend && bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Run backend tests
        run: bun test tests/
      - name: Run frontend tests
        run: cd frontend && bun run test

  build:
    name: Build bundle
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x
      - run: bun --version
      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile && (cd frontend && bun install --frozen-lockfile)
      - name: Build bundle
        run: VERSION=${GITHUB_REF_NAME#v} bash scripts/build-bundle.sh
      - name: Smoke test bundle
        shell: bash
        run: |
          mkdir -p /tmp/smoke
          tar -xzf "dist/nano-symphony-${GITHUB_REF_NAME#v}.tar.gz" -C /tmp/smoke
          SYMPHONY_SHARE_ROOT=/tmp/smoke/share bun /tmp/smoke/index.js &
          SERVER_PID=$!
          sleep 3
          curl -fsS http://localhost:4123/api/v1/health || { kill $SERVER_PID; exit 1; }
          kill $SERVER_PID
      - uses: actions/upload-artifact@v4
        with:
          name: nano-symphony-bundle
          path: dist/nano-symphony-*
          retention-days: 1

  release:
    name: GitHub Release & OSS Upload
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nano-symphony-bundle
          path: dist/
      - name: Generate release metadata
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          BUN_VERSION="1.2.x"
          PUBLIC_BASE_URL="https://binary-releases.oss-cn-hangzhou.aliyuncs.com/symphony"
          cat > dist/meta.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "latest_archive_url": "${PUBLIC_BASE_URL}/latest/nano-symphony.tar.gz",
            "latest_checksum_url": "${PUBLIC_BASE_URL}/latest/nano-symphony.tar.gz.sha256",
            "versioned_archive_url": "${PUBLIC_BASE_URL}/releases/${TAG}/nano-symphony-${VERSION}.tar.gz",
            "versioned_checksum_url": "${PUBLIC_BASE_URL}/releases/${TAG}/nano-symphony-${VERSION}.tar.gz.sha256",
            "install_script_url": "${PUBLIC_BASE_URL}/install.sh",
            "built_with": "bun-${BUN_VERSION}"
          }
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.json
          generate_release_notes: true
      - name: Setup ossutil
        run: |
          if [ -z "${{ secrets.OSS_ACCESS_KEY_ID }}" ]; then echo "OSS secrets not configured; skipping step"; exit 0; fi
          curl -sSL https://gosspublic.alicdn.com/ossutil/v2/2.2.1/ossutil-2.2.1-linux-amd64.zip -o ossutil.zip
          unzip ossutil.zip
          sudo mv ossutil-2.2.1-linux-amd64/ossutil /usr/local/bin/ossutil
      - name: Upload archive to OSS (versioned)
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          if [ -z "${{ secrets.OSS_ACCESS_KEY_ID }}" ]; then echo "OSS secrets not configured; skipping step"; exit 0; fi
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          ossutil cp dist/nano-symphony-${VERSION}.tar.gz oss://${{ secrets.OSS_BUCKET }}/symphony/releases/${TAG}/nano-symphony-${VERSION}.tar.gz --force --region cn-hangzhou
          ossutil cp dist/nano-symphony-${VERSION}.tar.gz.sha256 oss://${{ secrets.OSS_BUCKET }}/symphony/releases/${TAG}/nano-symphony-${VERSION}.tar.gz.sha256 --force --region cn-hangzhou
      - name: Upload archive to OSS (latest)
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          if [ -z "${{ secrets.OSS_ACCESS_KEY_ID }}" ]; then echo "OSS secrets not configured; skipping step"; exit 0; fi
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          cp dist/nano-symphony-${VERSION}.tar.gz dist/nano-symphony.tar.gz
          (cd dist && sha256sum nano-symphony.tar.gz > nano-symphony.tar.gz.sha256)
          ossutil cp dist/nano-symphony.tar.gz oss://${{ secrets.OSS_BUCKET }}/symphony/latest/nano-symphony.tar.gz --force --region cn-hangzhou
          ossutil cp dist/nano-symphony.tar.gz.sha256 oss://${{ secrets.OSS_BUCKET }}/symphony/latest/nano-symphony.tar.gz.sha256 --force --region cn-hangzhou
          ossutil cp dist/meta.json oss://${{ secrets.OSS_BUCKET }}/symphony/meta.json --force --region cn-hangzhou

  # TODO(post-bundle-ship): consider removing this job after confirming
  # no external consumers depend on direct OSS skill path.
  publish-skill:
    name: Publish Skill to OSS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup ossutil
        run: |
          if [ -z "${{ secrets.OSS_ACCESS_KEY_ID }}" ]; then echo "OSS secrets not configured; skipping step"; exit 0; fi
          curl -sSL https://gosspublic.alicdn.com/ossutil/v2/2.2.1/ossutil-2.2.1-linux-amd64.zip -o ossutil.zip
          unzip ossutil.zip
          sudo mv ossutil-2.2.1-linux-amd64/ossutil /usr/local/bin/ossutil
      - name: Upload skill to OSS (versioned)
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          if [ -z "${{ secrets.OSS_ACCESS_KEY_ID }}" ]; then echo "OSS secrets not configured; skipping step"; exit 0; fi
          TAG=${{ github.ref_name }}
          ossutil cp skills/nano-symphony/SKILL.md oss://${{ secrets.OSS_BUCKET }}/symphony/releases/${TAG}/SKILL.md --force --region cn-hangzhou
          ossutil cp skills/nano-symphony-local-loop/SKILL.md oss://${{ secrets.OSS_BUCKET }}/symphony/releases/${TAG}/skills/nano-symphony-local-loop/SKILL.md --force --region cn-hangzhou
      - name: Upload skill to OSS (latest)
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          if [ -z "${{ secrets.OSS_ACCESS_KEY_ID }}" ]; then echo "OSS secrets not configured; skipping step"; exit 0; fi
          ossutil cp skills/nano-symphony/SKILL.md oss://${{ secrets.OSS_BUCKET }}/symphony/skills/nano-symphony/SKILL.md --force --region cn-hangzhou
          ossutil cp skills/nano-symphony-local-loop/SKILL.md oss://${{ secrets.OSS_BUCKET }}/symphony/skills/nano-symphony-local-loop/SKILL.md --force --region cn-hangzhou

  publish-install-script:
    name: Publish Install Script to OSS
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup ossutil
        run: |
          if [ -z "${{ secrets.OSS_ACCESS_KEY_ID }}" ]; then echo "OSS secrets not configured; skipping step"; exit 0; fi
          curl -sSL https://gosspublic.alicdn.com/ossutil/v2/2.2.1/ossutil-2.2.1-linux-amd64.zip -o ossutil.zip
          unzip ossutil.zip
          sudo mv ossutil-2.2.1-linux-amd64/ossutil /usr/local/bin/ossutil
      - name: Upload install script to OSS
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          if [ -z "${{ secrets.OSS_ACCESS_KEY_ID }}" ]; then echo "OSS secrets not configured; skipping step"; exit 0; fi
          ossutil cp install.sh oss://${{ secrets.OSS_BUCKET }}/symphony/install.sh --force --region cn-hangzhou

